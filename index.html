<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>現世と冥界の四柱 - アシュラッテル</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root { --primary: #cbb982; --bg-gensei: #1a1a1a; --bg-meikai: #050010; font-family: sans-serif; }
        body { margin: 0; padding: 0; color: #eee; overflow: hidden; height: 100vh; background: var(--bg-gensei); transition: background 1s ease;}
        body.foran { background: var(--bg-meikai); }
        section { display: none; width: 100%; height: 100%; position: absolute; flex-direction: column; align-items: center; justify-content: center; }
        section.active { display: flex; }
        
        .menu-panel { background: rgba(0,0,0,0.8); padding: 40px; border: 2px solid var(--primary); text-align: center; border-radius:10px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { padding: 10px; font-size: 1.1em; width: 250px; background: #333; color: #fff; border: 1px solid var(--primary); border-radius: 5px;}
        button.main-btn { padding: 10px 30px; font-size: 1.2em; background: var(--primary); color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 5px;}

        .player-hud { position: absolute; background: rgba(0,0,0,0.6); padding: 10px; border: 1px solid #444; text-align:center;}
        .p-hud-n { top: 10px; left: 50%; transform: translateX(-50%); }
        .p-hud-e { top: 50%; right: 10px; transform: translateY(-50%); }
        .p-hud-s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .p-hud-w { top: 50%; left: 10px; transform: translateY(-50%); }
        .active-turn { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }
        
        .field-area { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 350px; height: 350px; position: relative; }
        .f-card-wrap { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .f-card-n { top: 0; left: 50%; transform: translateX(-50%); }
        .f-card-s { bottom: 0; left: 50%; transform: translateX(-50%); }
        .f-card-e { top: 50%; right: 0; transform: translateY(-50%); }
        .f-card-w { top: 50%; left: 0; transform: translateY(-50%); }
        .dir-label { font-weight: bold; color: var(--primary); margin-bottom: 5px; text-shadow: 0 0 5px black;}
        
        .center-redstone { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 5px; background: #2a1010; border: 2px solid #444; }
        .center-redstone.on { background: #ff0000; box-shadow: 0 0 20px #ff0000; border-color: #ffcccc; }

        .hand-area { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center;}
        .hand { display: flex; gap: 15px; margin-top: 5px;}
        .card { width: 80px; height: 110px; border-radius: 5px; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px; border: 3px solid #ccc; user-select: none;}
        .card.selected-red { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; transform: translateY(-10px); }

        #ui-panel { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background: rgba(0,0,0,0.8); padding: 10px; display: flex; gap: 10px; border: 1px solid var(--primary); }
        #chat-box { height: 100px; overflow-y: auto; flex: 1; border: 1px solid #333; padding: 5px; font-size: 0.85em; }
        #chat-input-area { display: flex; flex-direction: column; gap: 5px; width: 250px; }
        /* 🌟 飛んでいくカード用のアニメーション設定 */
        .flying-card {
            position: fixed;
            z-index: 9999;
            transition: all 0.5s ease-in-out;
            pointer-events: none; /* 飛んでいる最中にクリックを邪魔しない */
            margin: 0 !important;
        }
    </style>
</head>
<body>
    <section id="menu-screen" class="active">
        <div class="menu-panel">
            <h1 style="color:var(--primary)">アシュラッテル</h1>
            <div class="input-group"><input type="text" id="p-name-input" placeholder="あなたの名前" value="探求者"></div>
            <div class="input-group"><input type="text" id="room-id-input" placeholder="ルーム番号" value="777"></div>
            <button class="main-btn" onclick="startLoadingLobby()">儀式に参加する</button>
        </div>
    </section>

    <section id="lobby-screen">
        <h2>待機の間 (ルーム: <span id="display-room-id"></span>)</h2>
        <div id="player-list" style="display:flex; gap:10px; margin-bottom:20px;"></div>
        <button id="start-game-btn" onclick="requestStartGame()" style="display:none; padding:10px; background:#800; color:white; border:none; cursor:pointer;">ゲーム開始 (ホストのみ)</button>
    </section>

    <section id="game-screen">
        <div class="player-hud p-hud-n" id="hud-n"></div>
        <div class="player-hud p-hud-e" id="hud-e"></div>
        <div class="player-hud p-hud-s" id="hud-s"></div>
        <div class="player-hud p-hud-w" id="hud-w"></div>

        <div class="field-area">
            <div class="f-card-wrap f-card-n"><div class="dir-label">N(ニルポ)</div><div id="field-N"></div></div>
            <div class="f-card-wrap f-card-w"><div class="dir-label">W(ワルポ)</div><div id="field-W"></div></div>
            <div class="center-redstone" id="shared-redstone"></div>
            <div class="f-card-wrap f-card-e"><div class="dir-label">E(エルポ)</div><div id="field-E"></div></div>
            <div class="f-card-wrap f-card-s"><div class="dir-label">S(サルポ)</div><div id="field-S"></div></div>
        </div>

        <div class="hand-area">
            <div id="my-hand" class="hand"></div>
        </div>

        <div id="ui-panel">
            <div id="chat-box"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="コマンドを入力 (例: ラトン)">
                <div style="display:flex; gap:5px">
                    <button onclick="sendCommand()" style="flex:1">送信 / 詠唱</button>
                    <button onclick="callAshuratteru()" style="background:#600; color:white; border:1px solid #f00;">⚡ 指摘</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        const socket = io('https://threederea.onrender.com/'); // ⚠️変更を忘れずに
        let currentRoom = '';
        let myId = '';

        socket.on('connect', () => { myId = socket.id; });

        function showScreen(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startLoadingLobby() {
            const name = document.getElementById('p-name-input').value;
            const roomId = document.getElementById('room-id-input').value;
            if (!name || !roomId) return alert('入力してください');
            currentRoom = roomId;
            document.getElementById('display-room-id').innerText = currentRoom;
            socket.emit('joinRoom', { roomId: currentRoom, playerName: name });
            showScreen('lobby-screen');
        }

        function requestStartGame() { socket.emit('startGame', currentRoom); }

        function sendCommand() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) {
                socket.emit('chatCommand', { roomId: currentRoom, message: msg });
                input.value = '';
            }
        }
        
        document.getElementById('chat-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendCommand();
        });

        function callAshuratteru() { socket.emit('callAshuratteru', currentRoom); }

        // 🌟 右クリックイベントの送信
        function handleRightClick(e, index) {
            e.preventDefault(); // ブラウザ標準のメニューを封印
            socket.emit('rightClickHand', { roomId: currentRoom, index: index });
        }
        // 🌟 アニメーションの受信と実行
        socket.on('animateSwap', ({ playerId, playerDir, handIndex, targetDir }) => {
            let sourceEl;
            
            // 誰がラトンをしたかで、出発地点を変える
            if (playerId === myId) {
                // 自分の場合は、手札の特定のカードが出発点
                const handCards = document.querySelectorAll('#my-hand .card');
                sourceEl = handCards[handIndex];
            } else {
                // 他人の場合は、その人のHUD(名前の枠)から飛んでくるように見せる
                sourceEl = document.getElementById(`hud-${playerDir.toLowerCase()}`);
            }
            
            // 目的地の場のカード
            const targetEl = document.querySelector(`#field-${targetDir} .card`);

            if (!sourceEl || !targetEl) return;

            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();

            // 互いにカードを飛ばす
            createFlyingCard(sourceEl, srcRect, tgtRect, playerId !== myId);
            createFlyingCard(targetEl, tgtRect, srcRect, false);
        });

        // 🌟 クローンを作って飛ばす魔法の関数
        function createFlyingCard(originalEl, startRect, endRect, isHiddenSource) {
            let clone;
            
            // 他人の手札(HUD)から飛んでくる場合は、裏向きのカードを生成する
            if (isHiddenSource) {
                clone = document.createElement('div');
                clone.className = 'card flying-card';
                clone.innerHTML = '<div style="margin:auto; color:#444;">裏</div>';
                clone.style.borderColor = '#444';
            } else {
                // それ以外は元のカードをそっくりそのままコピー
                clone = originalEl.cloneNode(true);
                clone.classList.add('flying-card');
                clone.classList.remove('selected-red'); // 赤枠は消す
            }
            
            // 初期位置をセット
            clone.style.left = startRect.left + 'px';
            clone.style.top = startRect.top + 'px';
            clone.style.width = startRect.width + 'px';
            clone.style.height = startRect.height + 'px';
            
            document.body.appendChild(clone);

            // 一瞬待ってから目的地の座標へ移動させる（CSSのtransitionが発動）
            requestAnimationFrame(() => {
                clone.style.left = endRect.left + 'px';
                clone.style.top = endRect.top + 'px';
                // 少しだけ浮き上がりながら回転する演出
                clone.style.transform = 'scale(1.1) rotate(10deg)'; 
            });

            // 0.5秒後（到着後）にクローンを消し去る
            setTimeout(() => {
                clone.remove();
            }, 500);
        }
        socket.on('updateState', (state) => {
            if (state.gameState === 'lobby') {
                document.getElementById('player-list').innerHTML = state.players.map(p => `<div>${p.name}(${p.direction})</div>`).join('');
                if(state.players[0].id === myId) document.getElementById('start-game-btn').style.display = 'block';
            } 
            else if (state.gameState === 'playing' || state.gameState === 'gameover') {
                showScreen('game-screen');
                if (state.isForan) document.body.classList.add('foran'); else document.body.classList.remove('foran');

                ['N', 'E', 'S', 'W'].forEach((dir) => {
                    const p = state.players.find(p => p.direction === dir);
                    const hudElement = document.getElementById(`hud-${dir.toLowerCase()}`);
                    if (p && hudElement) {
                        hudElement.innerHTML = `<div>${p.name}</div><div>得点: ${p.score}</div>`;
                        if (state.turnIndex === state.players.indexOf(p) && state.gameState !== 'gameover') {
                            hudElement.classList.add('active-turn');
                        } else {
                            hudElement.classList.remove('active-turn');
                        }
                    }
                });

                const rs = document.getElementById('shared-redstone');
                if (state.redstoneActive) rs.classList.add('on'); else rs.classList.remove('on');

                ['N', 'E', 'S', 'W'].forEach(dir => {
                    document.getElementById(`field-${dir}`).innerHTML = createCardHTML(state.fieldCards[dir]);
                });

                // 手札の描画 (ゲーム終了時は全員のカードが見えるようにするなどの拡張も可能)
                const me = state.players.find(p => p.id === myId);
                if (me && me.hand) {
                    document.getElementById('my-hand').innerHTML = me.hand.map((card, i) => {
                        const isSelected = (me.ratonHandIndex === i) ? 'selected-red' : '';
                        // oncontextmenu で右クリックを検知
                        return `<div oncontextmenu="handleRightClick(event, ${i})" class="${isSelected}">${createCardHTML(card)}</div>`;
                    }).join('');
                    
                    const inputField = document.getElementById('chat-input');
                    if (me.commandState !== 'idle') {
                        inputField.style.border = '2px solid red'; inputField.style.background = '#400';
                    } else {
                        inputField.style.border = 'none'; inputField.style.background = '#fff';
                    }
                }
            }
        });

        const colorVars = { '桃色': '#ff0080', '青色': '#0080ff', '緑色': '#00ff80', '黄色': '#ffff00' };
        function createCardHTML(card) {
            if (!card) return '<div class="card" style="border-color:#444">裏</div>';
            const cStr = colorVars[card.color] || '#ccc';
            return `<div class="card" style="border-color:${cStr}; color:${cStr}">
                <div style="font-size:0.8em">${card.symbol}</div>
                <div style="font-size:1.5em; font-weight:bold">${card.number}</div>
            </div>`;
        }

        socket.on('systemMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });
        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
