<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>現世と冥界の四柱 - 魔法詠唱カードゲーム</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #cbb982; /* 古代の金 */
            --bg-gensei: #1a1a1a;
            --bg-meikai: #050010;
            --font-main: 'Segoe UI', 'Roboto', helvetica, sans-serif;
            
            /* カード色 */
            --c-pink: #ff0080; --c-blue: #0080ff; --c-green: #00ff80; --c-yellow: #ffff00;
        }

        body {
            margin: 0; padding: 0; font-family: var(--font-main);
            color: #eee; overflow: hidden; height: 100vh;
        }

        /* 画面切り替えの基本設定 */
        section {
            display: none; /* 初期状態は非表示 */
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            flex-direction: column; align-items: center; justify-content: center;
        }
        section.active { display: flex; animation: fadeIn 0.5s ease; } /* .activeが付いた画面を表示 */

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- メニュー画面 (image_1.pngを背景に) --- */
        #menu-screen {
            background-image: url('image_1.png');
            background-size: cover; background-position: center;
        }
        .menu-panel {
            background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px;
            border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(203,185,130,0.5);
            text-align: center;
        }
        h1.title { color: var(--primary); font-size: 3em; text-shadow: 0 0 15px var(--primary); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        input[type="text"] {
            padding: 15px; border-radius: 5px; border: 1px solid var(--primary);
            background: rgba(0,0,0,0.5); color: white; font-size: 1.1em; width: 300px;
        }
        button.main-btn {
            padding: 15px 40px; font-size: 1.3em; font-weight: bold; background: var(--primary);
            border: none; border-radius: 10px; color: #111; cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button.main-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary); }

        /* --- 待機ロビー画面 --- */
        #lobby-screen { background: var(--bg-gensei); }
        #player-list { display: flex; gap: 20px; margin: 40px 0; }
        .player-slot {
            width: 150px; height: 200px; border: 2px dashed #444; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05); color: gray; font-size: 1.2em;
        }
        .player-slot.occupied { border-style: solid; border-color: var(--primary); color: white; background: #000;}

        /* --- ゲーム画面 (リッチ化) --- */
        #game-screen {
            background: var(--bg-gensei); transition: background 1s ease;
        }
        #game-screen.foran {
            background: var(--bg-meikai); animation: meikai-glow 2s infinite alternate;
        }
        @keyframes meikai-glow { from { box-shadow: inset 0 0 50px rgba(128,0,255,0.3); } to { box-shadow: inset 0 0 100px rgba(128,0,255,0.5); } }

        /* プレイヤー情報（電球とレッドストーン） */
        .player-hud { position: absolute; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border: 1px solid #444; }
        .player-hud.active-turn { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .p-hud-n { top: 10px; left: 50%; transform: translateX(-50%); }
        .p-hud-e { top: 50%; right: 10px; transform: translateY(-50%); }
        .p-hud-s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .p-hud-w { top: 50%; left: 10px; transform: translateY(-50%); }

        .p-name { font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .lamps { display: flex; gap: 5px; align-items: center; }
        /* 銅の電球（スコア） */
        .bulb { width: 15px; height: 15px; border-radius: 50%; background: #3a2a1a; border: 1px solid #5a4a3a; transition: background 0.5s; }
        .bulb.on { background: #b87333; box-shadow: 0 0 10px #b87333; border-color: #ff9d4d; } /* 銅色に光る */
        /* レッドストーンランプ（特殊技） */
        .redstone { width: 15px; height: 15px; border-radius: 50%; background: #2a1010; border: 1px solid #4a2a2a; }
        .redstone.on { background: #ff0000; box-shadow: 0 0 10px #ff0000; border-color: #ffcccc; } /* 赤く光る */

        /* カードの美しいUI (サイバー・エジプト) */
        .card {
            width: 100px; height: 140px; border-radius: 8px; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 8px; border: 4px solid var(--c-main); box-shadow: 0 0 15px var(--c-main);
            color: #fff; transition: transform 0.2s; position: relative;
        }
        .card:hover { transform: translateY(-10px); }
        .card::before { /* カード内部の模様 */
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%);
        }
        .c-type { font-size: 0.7em; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); }
        .c-symbol { font-size: 2.5em; text-shadow: 0 0 10px #fff; }
        .c-number { font-size: 1.2em; font-weight: bold; }

        .field-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .hand-area { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); text-align: center; }
        .hand { display: flex; gap: 15px; }

        /* チャットとコマンドUI (サイバー風) */
        #ui-panel {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 700px; background: rgba(0,0,0,0.8);
            padding: 10px; border-radius: 10px; border: 1px solid var(--primary);
            display: flex; gap: 10px;
        }
        #chat-box { height: 100px; overflow-y: auto; flex: 1; border: 1px solid #333; padding: 5px; font-size: 0.85em; color: #ccc; }
        #chat-input-area { display: flex; flex-direction: column; gap: 5px; width: 250px; }
        #ashuratteru-btn { background: #600; border: 2px solid #a00; font-size: 0.9em; text-shadow: 0 0 5px #f00;}
        #ashuratteru-btn:hover { background: #900; box-shadow: 0 0 10px #f00; }

    </style>
</head>
<body>

    <section id="menu-screen" class="active">
        <div class="menu-panel">
            <h1 class="title">現世と冥界の四柱</h1>
            <div class="input-group">
                <input type="text" id="p-name-input" placeholder="あなたの名前を入力" value="探求者">
            </div>
            <button class="main-btn" onclick="startLoadingLobby()">儀式に参加する</button>
        </div>
    </section>

    <section id="lobby-screen">
        <h1 class="title">待機の間</h1>
        <p>他の探求者の到着を待っています...</p>
        <div id="player-list">
            </div>
        <div class="input-group">
            <button class="main-btn" id="start-game-btn" onclick="requestStartGame()" style="display:none; background:#800; color:white;">4人でゲーム開始 (ホストのみ)</button>
        </div>
        <p style="color:gray; font-size:0.8em">※1人でも開始可能（CPUが代入されます）</p>
    </section>

    <section id="game-screen">
        <div class="player-hud p-hud-n" id="hud-n"></div>
        <div class="player-hud p-hud-e" id="hud-e"></div>
        <div class="player-hud p-hud-s" id="hud-s"></div>
        <div class="player-hud p-hud-w" id="hud-w"></div>

        <div class="field-area">
            <h3>場のカード</h3>
            <div id="field-card-container"></div>
        </div>

        <div class="hand-area">
            <div id="my-hand" class="hand"></div>
        </div>

        <div id="ui-panel">
            <div id="chat-box"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="魔法詠唱 (例: ムー)">
                <div style="display:flex; gap:5px">
                    <button onclick="sendCommand()" style="flex:1">詠唱</button>
                    <button id="ashuratteru-btn" onclick="callAshuratteru()">⚡ 指摘</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // ⚠️ あなたのRenderのURLに書き換えてください。
        const socket = io('https://threederea.onrender.com/'); 
        
        let currentRoom = 'ROOM_1'; // 今回は1つのルーム固定
        let myId = '';
        const DIRECTIONS = ['n', 'e', 's', 'w'];

        socket.on('connect', () => { myId = socket.id; });

        // 画面（セクション）を切り替える関数
        function showScreen(screenId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- 1. メニュー処理 ---
        function startLoadingLobby() {
            const nameInput = document.getElementById('p-name-input');
            if (!nameInput.value) return alert('名前を入力してください');
            
            // サーバーに入室リクエスト
            socket.emit('joinRoom', { roomId: currentRoom, playerName: nameInput.value });
            
            // ロビー画面のUI初期化（4つのスロットを作る）
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            for(let i=0; i<4; i++) {
                list.innerHTML += `<div class="player-slot" id="slot-${i}">待機中...</div>`;
            }
            showScreen('lobby-screen'); // 待機画面へ
        }

        // --- 2. ロビー処理 ---
        function requestStartGame() {
            socket.emit('startGame', currentRoom);
        }

        // --- 3. ゲーム処理 ---
        function sendCommand() {
            const input = document.getElementById('chat-input');
            if (input.value) {
                socket.emit('chatCommand', { roomId: currentRoom, message: input.value });
                input.value = '';
            }
        }
        function callAshuratteru() {
            socket.emit('callAshuratteru', currentRoom);
        }

        // --- サーバーからの状態更新を受け取る (ゲームの中心) ---
        socket.on('updateState', (state) => {
            // A. 画面の切り替え
            if (state.gameState === 'lobby') {
                showScreen('lobby-screen');
                // ロビーのプレイヤーリスト更新
                document.querySelectorAll('.player-slot').forEach(s => {s.classList.remove('occupied'); s.innerText = '待機中...';});
                state.players.forEach((p, i) => {
                    const slot = document.getElementById(`slot-${i}`);
                    slot.classList.add('occupied');
                    slot.innerText = p.name + `\n(${p.direction})`;
                });
                // ホスト（最初のプレイヤー）なら開始ボタンを表示
                if(state.players[0].id === myId) {
                    document.getElementById('start-game-btn').style.display = 'block';
                }
            } 
            else if (state.gameState === 'playing') {
                showScreen('game-screen'); // ゲーム画面へ
                
                // B. 背景の変更（フォラン/未フォラン）
                if (state.isForan) document.body.classList.add('foran');
                else document.body.classList.remove('foran');

                // C. プレイヤー情報(HUD)の更新
                updateHud(state);

                // D. 中央カードと自分の手札の描画
                document.getElementById('field-card-container').innerHTML = createCardHTML(state.fieldCard);
                const me = state.players.find(p => p.id === myId);
                if (me) {
                    const handHtml = me.hand.map(card => createCardHTML(card)).join('');
                    document.getElementById('my-hand').innerHTML = handHtml;
                }
            }
        });

        // HUD（プレイヤー情報とランプ）を更新する関数
        function updateHud(state) {
            DIRECTIONS.forEach((dir_letter, i) => {
                const hud = document.getElementById(`hud-${dir_letter}`);
                const player = state.players[i]; // N=0, E=1...の想定
                
                if (!player) { hud.style.display = 'none'; return; }
                
                hud.style.display = 'block';
                // ターンなら光らせる
                if (state.turnIndex === i) hud.classList.add('active-turn');
                else hud.classList.remove('active-turn');

                // 電球(スコア)とレッドストーンのHTML生成
                let bulbsHtml = '';
                for(let j=0; j<2; j++) bulbsHtml += `<div class="bulb ${j < player.score ? 'on' : ''}"></div>`; // スコア分点灯
                
                let redstoneHtml = `<div class="redstone ${player.hasRedstone ? 'on' : ''}"></div>`; // 使用可能なら点灯

                hud.innerHTML = `
                    <div class="p-name">${player.name}</div>
                    <div class="lamps">
                        <span>銅:</span>${bulbsHtml}
                        <span style="margin-left:5px">R:</span>${redstoneHtml}
                    </div>
                `;
            });
        }

        // カードのHTML（ Unicodeアイコンを絵柄に使用してリッチに ）
        const symbolIcons = { 'ピラミッド': '🔺', '目玉': '👁️', '太陽': '☀️', 'アミュレット': '🔮' };
        const colorVars = { '桃色': '--c-pink', '青色': '--c-blue', '緑色': '--c-green', '黄色': '--c-yellow' };

        function createCardHTML(card) {
            if (!card) return '<div class="card" style="border-color:#444">空</div>';
            
            // 型、絵柄をサーバー文字列から抽出
            const type = card.symbol.split('(')[0]; // ハティロンなど
            const symbolName = card.symbol.match(/\((.*)\)/)[1]; // ピラミッドなど
            const icon = symbolIcons[symbolName] || '？';
            const colorVar = colorVars[card.color] || '--primary';

            return `
                <div class="card" style="--c-main: var(${colorVar})">
                    <span class="c-type">${card.color} ${type}</span>
                    <span class="c-symbol">${icon}</span>
                    <span class="c-number">${card.number}</span>
                </div>
            `;
        }

        socket.on('systemMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });
        
        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
