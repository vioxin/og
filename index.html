<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>現世と冥界の四柱 - アシュラッテル</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root { --primary: #cbb982; font-family: sans-serif; }
        
        /* 🌟 冥界（フォラン）の演出 */
        body { 
            margin: 0; padding: 0; color: #eee; overflow: hidden; height: 100vh; 
            /* 現世の背景（ダークグレー〜緑系） */
            background: radial-gradient(circle at center, #2b332b 0%, #0a0a0a 100%);
            transition: background 1.5s ease-in-out; 
        }
        body.foran { 
            /* 冥界の背景（禍々しい赤紫系） */
            background: radial-gradient(circle at center, #52001a 0%, #0f0005 100%); 
        }

        section { display: none; width: 100%; height: 100%; position: absolute; flex-direction: column; align-items: center; justify-content: center; }
        section.active { display: flex; }
        
        .menu-panel { background: rgba(0,0,0,0.8); padding: 40px; border: 2px solid var(--primary); text-align: center; border-radius:10px; }
        .input-group { margin-bottom: 15px; }
        input[type="text"] { padding: 10px; font-size: 1.1em; width: 250px; background: #333; color: #fff; border: 1px solid var(--primary); border-radius: 5px;}
        button.main-btn { padding: 10px 20px; font-size: 1em; background: var(--primary); color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 5px; margin: 5px;}

        /* --- ゲーム画面のレイアウト --- */
        #game-board { position: relative; width: 100vw; height: 100vh; }

        /* 他プレイヤー情報 (HUD) */
        .player-hud { position: absolute; background: rgba(0,0,0,0.7); padding: 10px 20px; border: 1px solid #444; text-align:center; border-radius: 5px;}
        .p-hud-n { top: 20px; left: 50%; transform: translateX(-50%); }
        .p-hud-e { top: 50%; right: 20px; transform: translateY(-50%); }
        .p-hud-w { top: 50%; left: 20px; transform: translateY(-50%); }
        .p-hud-s { bottom: 160px; left: 50%; transform: translateX(-50%); } /* 自分の上 */
        .active-turn { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); background: rgba(80, 60, 20, 0.8);}
        
        /* 🌟 場札エリア（完全中央） */
        .field-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; }
        .f-card-wrap { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .f-card-n { top: 0; left: 50%; transform: translateX(-50%); }
        .f-card-s { bottom: 0; left: 50%; transform: translateX(-50%); }
        .f-card-e { top: 50%; right: 0; transform: translateY(-50%); }
        .f-card-w { top: 50%; left: 0; transform: translateY(-50%); }
        .dir-label { font-weight: bold; color: var(--primary); margin-bottom: 5px; text-shadow: 0 0 5px black;}
        
        .center-redstone { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: #2a1010; border: 2px solid #444; }
        .center-redstone.on { background: #ff0000; box-shadow: 0 0 30px #ff0000; border-color: #ffcccc; }

        /* 🌟 手札エリア（画面下部） */
        .hand-area { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); text-align: center;}
        .hand { display: flex; gap: 15px;}
        
        /* カードのデザイン */
        .card { width: 70px; height: 100px; border-radius: 5px; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px; border: 3px solid #ccc; user-select: none; transition: transform 0.2s;}
        .card:hover { transform: translateY(-5px); }
        .card.selected-red { border-color: #ff0000 !important; box-shadow: 0 0 15px #ff0000; transform: translateY(-15px); }

        /* 🌟 チャットエリア（右下へ隔離） */
        #ui-panel { position: absolute; bottom: 30px; right: 30px; width: 300px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid var(--primary); border-radius: 5px; display: flex; flex-direction: column; gap: 10px;}
        #chat-box { height: 150px; overflow-y: auto; border: 1px solid #333; padding: 10px; font-size: 0.9em; line-height: 1.4; background: #000;}
        #chat-input-area { display: flex; flex-direction: column; gap: 5px; }
        #chat-input { padding: 8px; font-size: 1em; background: #222; border: 1px solid #555; color: white; }

        /* 飛ぶカード用のアニメーション */
        .flying-card { position: fixed; z-index: 9999; transition: all 0.5s ease-in-out; pointer-events: none; margin: 0 !important; }
    </style>
</head>
<body>
    <section id="menu-screen" class="active">
        <div class="menu-panel">
            <h1 style="color:var(--primary)">アシュラッテル</h1>
            <div class="input-group"><input type="text" id="p-name-input" placeholder="あなたの名前" value="探求者"></div>
            <div style="display:flex; justify-content:center; gap:10px;">
                <button class="main-btn" onclick="createRoom()">ルームを作成</button>
            </div>
            <hr style="border-color:#444; margin: 20px 0;">
            <div class="input-group"><input type="text" id="room-id-input" placeholder="参加するルーム番号"></div>
            <button class="main-btn" onclick="joinRoom()" style="background:#555; color:#fff;">番号で参加</button>
        </div>
    </section>

    <section id="lobby-screen">
        <h2>待機の間 (ルーム: <span id="display-room-id" style="color:var(--primary); font-size:1.5em;"></span>)</h2>
        <div id="player-list" style="display:flex; gap:20px; margin-bottom:20px; font-size:1.2em;"></div>
        <p style="color:#aaa;">4人未満で開始した場合、空き枠にはCPUが自動で入ります。</p>
        <button id="start-game-btn" onclick="requestStartGame()" style="display:none; padding:15px 30px; font-size:1.2em; background:#800; color:white; border:none; cursor:pointer; border-radius:5px;">儀式を開始する</button>
    </section>

    <section id="game-screen">
        <div id="game-board">
            <div class="player-hud p-hud-n" id="hud-N"></div>
            <div class="player-hud p-hud-e" id="hud-E"></div>
            <div class="player-hud p-hud-w" id="hud-W"></div>
            <div class="player-hud p-hud-s" id="hud-S"></div> <div class="field-area">
                <div class="f-card-wrap f-card-n"><div class="dir-label">N(ニルポ)</div><div id="field-N"></div></div>
                <div class="f-card-wrap f-card-w"><div class="dir-label">W(ワルポ)</div><div id="field-W"></div></div>
                <div class="center-redstone" id="shared-redstone"></div>
                <div class="f-card-wrap f-card-e"><div class="dir-label">E(エルポ)</div><div id="field-E"></div></div>
                <div class="f-card-wrap f-card-s"><div class="dir-label">S(サルポ)</div><div id="field-S"></div></div>
            </div>

            <div class="hand-area">
                <div style="color:var(--primary); margin-bottom:10px; font-weight:bold;">あなたの手札 (右クリックで選択)</div>
                <div id="my-hand" class="hand"></div>
            </div>

            <div id="ui-panel">
                <div id="chat-box"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="コマンドを入力 (例: ラトン)">
                    <div style="display:flex; gap:5px">
                        <button onclick="sendCommand()" style="flex:1; padding:8px; background:var(--primary); border:none; font-weight:bold;">詠唱</button>
                        <button onclick="callAshuratteru()" style="background:#600; color:white; border:none; padding:8px;">⚡ 指摘</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const socket = io('https://threederea.onrender.com/'); // ⚠️ ここは必ず変更してください！
        let currentRoom = '';
        let myId = '';

        socket.on('connect', () => { myId = socket.id; });

        function showScreen(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 🚪 ルーム作成
        function createRoom() {
            const name = document.getElementById('p-name-input').value;
            if (!name) return alert('名前を入力してください');
            socket.emit('createRoom', name);
        }
        socket.on('roomCreated', (roomId) => {
            currentRoom = roomId;
            document.getElementById('display-room-id').innerText = currentRoom;
            showScreen('lobby-screen');
        });

        // 🚪 ルーム参加
        function joinRoom() {
            const name = document.getElementById('p-name-input').value;
            const roomId = document.getElementById('room-id-input').value;
            if (!name || !roomId) return alert('名前とルーム番号を入力してください');
            currentRoom = roomId;
            document.getElementById('display-room-id').innerText = currentRoom;
            socket.emit('joinRoom', { roomId: currentRoom, playerName: name });
            showScreen('lobby-screen');
        }

        function requestStartGame() { socket.emit('startGame', currentRoom); }

        function sendCommand() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) { socket.emit('chatCommand', { roomId: currentRoom, message: msg }); input.value = ''; }
        }
        document.getElementById('chat-input').addEventListener('keypress', e => { if (e.key === 'Enter') sendCommand(); });

        function callAshuratteru() { socket.emit('callAshuratteru', currentRoom); }

        function handleRightClick(e, index) {
            e.preventDefault();
            socket.emit('rightClickHand', { roomId: currentRoom, index: index });
        }

        // 🌟 状態の更新描画
        socket.on('updateState', (state) => {
            if (state.gameState === 'lobby') {
                document.getElementById('player-list').innerHTML = state.players.map(p => `<div>${p.name} (${p.direction})</div>`).join('');
                if(state.players[0].id === myId) document.getElementById('start-game-btn').style.display = 'block';
            } 
            else if (state.gameState === 'playing' || state.gameState === 'gameover') {
                showScreen('game-screen');
                
                // フォラン演出（背景変更）
                if (state.isForan) document.body.classList.add('foran'); else document.body.classList.remove('foran');

                ['N', 'E', 'S', 'W'].forEach((dir) => {
                    const p = state.players.find(p => p.direction === dir);
                    const hudElement = document.getElementById(`hud-${dir}`);
                    if (p && hudElement) {
                        hudElement.innerHTML = `<div>${p.name}</div><div style="font-size:0.8em; color:#ccc;">得点: ${p.score}</div>`;
                        if (state.turnIndex === state.players.indexOf(p) && state.gameState !== 'gameover') {
                            hudElement.classList.add('active-turn');
                        } else {
                            hudElement.classList.remove('active-turn');
                        }
                    }
                });

                const rs = document.getElementById('shared-redstone');
                if (state.redstoneActive) rs.classList.add('on'); else rs.classList.remove('on');

                ['N', 'E', 'S', 'W'].forEach(dir => {
                    document.getElementById(`field-${dir}`).innerHTML = createCardHTML(state.fieldCards[dir]);
                });

                const me = state.players.find(p => p.id === myId);
                if (me && me.hand) {
                    document.getElementById('my-hand').innerHTML = me.hand.map((card, i) => {
                        const isSelected = (me.ratonHandIndex === i) ? 'selected-red' : '';
                        return `<div oncontextmenu="handleRightClick(event, ${i})" class="${isSelected}">${createCardHTML(card)}</div>`;
                    }).join('');
                    
                    const inputField = document.getElementById('chat-input');
                    if (me.commandState !== 'idle') {
                        inputField.style.border = '2px solid red'; inputField.style.background = '#400';
                    } else {
                        inputField.style.border = '1px solid #555'; inputField.style.background = '#222';
                    }
                }
            }
        });

        const colorVars = { '桃色': '#ff66b2', '青色': '#66b2ff', '緑色': '#66ff66', '黄色': '#ffff66' };
        function createCardHTML(card) {
            if (!card) return '<div class="card" style="border-color:#444; color:#444;"><div style="margin:auto">裏</div></div>';
            const cStr = colorVars[card.color] || '#ccc';
            return `<div class="card" style="border-color:${cStr}; color:${cStr}">
                <div style="font-size:0.8em">${card.symbol}</div>
                <div style="font-size:1.8em; font-weight:bold">${card.number}</div>
            </div>`;
        }

        socket.on('systemMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div style="margin-bottom:5px;">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        // 🌟 カードが飛ぶアニメーション
        socket.on('animateSwap', ({ playerId, playerDir, handIndex, targetDir }) => {
            let sourceEl;
            if (playerId === myId) {
                const handCards = document.querySelectorAll('#my-hand .card');
                sourceEl = handCards[handIndex];
            } else {
                sourceEl = document.getElementById(`hud-${playerDir}`);
            }
            
            const targetEl = document.querySelector(`#field-${targetDir} .card`);
            if (!sourceEl || !targetEl) return;

            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();

            createFlyingCard(sourceEl, srcRect, tgtRect, playerId !== myId);
            createFlyingCard(targetEl, tgtRect, srcRect, false);
        });

        function createFlyingCard(originalEl, startRect, endRect, isHiddenSource) {
            let clone;
            if (isHiddenSource) {
                clone = document.createElement('div');
                clone.className = 'card flying-card';
                clone.innerHTML = '<div style="margin:auto; color:#444;">裏</div>';
                clone.style.borderColor = '#444';
                clone.style.background = '#111';
            } else {
                clone = originalEl.cloneNode(true);
                clone.classList.add('flying-card');
                clone.classList.remove('selected-red');
            }
            
            clone.style.left = startRect.left + 'px';
            clone.style.top = startRect.top + 'px';
            clone.style.width = startRect.width + 'px';
            clone.style.height = startRect.height + 'px';
            document.body.appendChild(clone);

            requestAnimationFrame(() => {
                clone.style.left = endRect.left + 'px';
                clone.style.top = endRect.top + 'px';
                clone.style.transform = 'scale(1.1) rotate(5deg)'; 
            });

            setTimeout(() => clone.remove(), 500);
        }

        socket.on('errorMsg', (msg) => alert(msg));
    </script>
</body>
</html>
