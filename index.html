<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>現世と冥界の四柱</title>
    <style>
        :root {
            --bg-gensei: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --bg-meikai: linear-gradient(135deg, #232526 0%, #414345 100%);
            --card-pink: #ffb8c6; --card-blue: #a0c4ff;
            --card-green: #caffbf; --card-yellow: #fdffb6;
        }
        body {
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0; padding: 20px;
            background: var(--bg-gensei); transition: background 1s ease;
            color: #333; display: flex; flex-direction: column; align-items: center;
        }
        body.foran { background: var(--bg-meikai); color: #eee; }
        
        h1 { text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .board { display: flex; gap: 30px; margin-top: 20px; width: 100%; max-width: 800px; justify-content: center;}
        
        /* カードの美しいUIデザイン */
        .card {
            width: 100px; height: 140px;
            border-radius: 10px; background: white; color: #111;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; text-align: center; padding: 5px;
            border: 6px solid #ccc;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card[data-color="桃色"] { border-color: var(--card-pink); }
        .card[data-color="青色"] { border-color: var(--card-blue); }
        .card[data-color="緑色"] { border-color: var(--card-green); }
        .card[data-color="黄色"] { border-color: var(--card-yellow); }
        .card-number { font-size: 2em; margin-top: 10px; }

        .player-area, .field-area { display: flex; flex-direction: column; align-items: center; }
        .hand { display: flex; gap: 10px; margin-top: 10px; }
        
        /* チャットとコマンドUI */
        .ui-panel {
            width: 100%; max-width: 600px; margin-top: 30px;
            background: rgba(255,255,255,0.8); padding: 15px; border-radius: 10px;
        }
        body.foran .ui-panel { background: rgba(0,0,0,0.6); }
        #chat-box { height: 150px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #6c5ce7; color: white;}
        button:hover { background: #5b4bc4; }
        #ashuratteru-btn { background: #ff4757; }
    </style>
</head>
<body>

    <h1 id="title">🔮 現世と冥界の四柱</h1>
    <button onclick="joinRoom('ROOM_1')">ゲームルームに入室する</button>

    <div class="board">
        <div class="field-area">
            <h3>場のカード (中央)</h3>
            <div id="field-card"></div>
        </div>
    </div>

    <div class="player-area">
        <h3>あなたの手札</h3>
        <div id="my-hand" class="hand"></div>
    </div>

    <div class="ui-panel">
        <div id="chat-box"></div>
        <div class="controls">
            <input type="text" id="chat-input" placeholder="詠唱するコマンドを入力 (例: ラトン)">
            <button onclick="sendCommand()">詠唱</button>
            <button id="ashuratteru-btn" onclick="callAshuratteru()">⚡ アシュラッテル</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        // ⚠️ 変更2：RenderのサーバーURLを直接指定して接続する
        // "あなたのアプリ名" の部分を、Renderで発行されたURLに変えてください。
        const socket = io('https://threederea.onrender.com/');
        
        let currentRoom = '';
        let myId = '';

        // （以下、前回と同じJavaScriptの処理が続きます）
        const socket = io();
        let currentRoom = '';
        let myId = '';

        socket.on('connect', () => { myId = socket.id; });

        function joinRoom(roomId) {
            currentRoom = roomId;
            socket.emit('joinRoom', roomId);
        }

        function sendCommand() {
            if (!currentRoom) return alert("入室してください");
            const input = document.getElementById('chat-input');
            if (input.value) {
                socket.emit('chatCommand', { roomId: currentRoom, message: input.value });
                input.value = '';
            }
        }

        function callAshuratteru() {
            if (!currentRoom) return;
            socket.emit('callAshuratteru', currentRoom);
        }

        socket.on('systemMessage', (msg) => {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div>${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        // 状態が更新されたら画面を描画し直す
        socket.on('updateState', (state) => {
            // 背景の変更（フォラン）
            if (state.isForan) document.body.classList.add('foran');
            else document.body.classList.remove('foran');

            // 中央のカード描画
            document.getElementById('field-card').innerHTML = createCardHTML(state.fieldCard);

            // 自分の手札描画
            const me = state.players.find(p => p.id === myId);
            if (me) {
                const handHtml = me.hand.map(card => createCardHTML(card)).join('');
                document.getElementById('my-hand').innerHTML = handHtml;
            }
        });

        // カードのHTMLを生成する関数
        function createCardHTML(card) {
            if (!card) return '<div class="card">空</div>';
            return `
                <div class="card" data-color="${card.color}">
                    <span style="font-size: 0.8em; color: gray;">${card.color}</span>
                    <span style="font-size: 0.9em;">${card.symbol}</span>
                    <div class="card-number">${card.number}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
